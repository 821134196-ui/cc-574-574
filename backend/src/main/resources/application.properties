# HTTP
quarkus.http.port=8080
quarkus.http.static-resources.index-page=index.html
quarkus.http.limits.max-body-size=20M

# SQLite 配置：
# - 不使用 WAL（WAL 多连接下会出现 SQLITE_BUSY_SNAPSHOT 快照冲突），用默认回滚日志
# - 连接池大小固定为 1，所有事务在同一连接上串行执行，写不会自锁；busy_timeout 防外部占用
# - 并发审批先查持有人，再由部分唯一索引 ux_active_loan 兜底，第二笔拿到 409
app.data.dir=data
app.scans.dir=data/scans
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.url=jdbc:sqlite:${app.data.dir}/contract-loan.db?busy_timeout=8000
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.acquisition-timeout=15S

# Hibernate
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.database.generation=create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=false

# 业务参数
app.loan.max-days=15
app.loan.due-soon-days=2
