# HTTP
quarkus.http.port=8080

# SQLite datasource (file path can be overridden with -Ddata.file=...)
quarkus.datasource.jdbc.url=jdbc:sqlite:${data.file:./data/contracts.db}
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=1
# SQLite 每个新连接的忙等待（毫秒），配合 WAL 让并发写串行等待而非立即报错
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=10000

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Scheduler: run overdue / reminder sweep
contracts.reminder.cron=0 * * * * ?

# Local scan storage directory
contracts.scan.dir=${scan.dir:./data/scans}
